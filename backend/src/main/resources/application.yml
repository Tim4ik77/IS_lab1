server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/tickets}
    username: ${DB_USER:tickets}
    password: ${DB_PASSWORD:tickets_local}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
